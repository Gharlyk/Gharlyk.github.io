---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <div class="post-content">
    {{ content }}
    {% if page.repo %}
      <p><a href="{{ page.repo }}">View code on GitHub →</a></p>
    {% endif %}
  </div>
</article>
